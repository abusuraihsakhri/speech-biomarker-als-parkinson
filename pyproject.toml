[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "speech-biomarker-als-parkinson"
version = "2.0.0"
description = "VocalMarker-AI: Acoustic Jitter, Shimmer & Dysarthria Biomarker Engine"
readme = "README.md"
authors = [{ name = "Dr. Abu Suraih Sakhri", email = "abusuraih@example.com" }]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security/Cryptography",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.9"
dependencies = ["pydantic>=2,<3"]

[project.optional-dependencies]
api = ["fastapi>=0.110,<1", "uvicorn>=0.29,<1"]
test = ["pytest>=8,<10", "httpx>=0.27,<1"]

[project.scripts]
speech-biomarker-als-parkinson = "cli:main"

[project.urls]
Homepage = "https://github.com/abusuraihsakhri/speech-biomarker-als-parkinson"
Repository = "https://github.com/abusuraihsakhri/speech-biomarker-als-parkinson.git"

[tool.setuptools]
packages = ["agents", "vocal_marker_ai"]
py-modules = ["cli", "enrichment", "simulator", "vocal_marker_ai_app"]
